# Use something easier to type as the prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Relax!
set -sg escape-time 10
set -sg repeat-time 600
set -g history-limit 50000
set -g focus-events on
set -g renumber-windows on
set -g mouse on

# Clipboard via OSC 52: the outer terminal (Ghostty, Windows Terminal) sets
# the local clipboard, so this works locally, over SSH, and in nested tmux.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'
bind-key -T copy-mode-vi C-\\ send-keys -X copy-pipe-and-cancel

# Less stretching to get to the first item.
set -g base-index 1
setw -g pane-base-index 1

# Reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

unbind t
# Saner splitting.
bind v split-window -h -c "#{pane_current_path}"
bind S split-window -v -c "#{pane_current_path}"

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

# Window movement
bind -r , select-window -t :-
bind -r . select-window -t :+

# UI
# tmux-256color gets italics etc. right; fall back if the terminfo entry is missing.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",*:RGB"

# Activity
setw -g monitor-activity on
set -g visual-activity off

# Better name management
bind c new-window \; command-prompt "rename-window '%%'"
bind C new-window -c "#{pane_current_path}"
bind R command-prompt "rename-window '%%'"

# Copy mode
setw -g mode-keys vi
unbind p
bind p paste-buffer

# default statusbar colours
set-option -g status-style fg=colour33,bg=colour8,default

# default window title colours
set-window-option -g window-status-style fg=colour33,bg=default

# active window title colours
set-window-option -g window-status-current-style fg=default,bg=default

# pane border
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour46

# message text
set-option -g message-style fg=colour7,bg=colour8
